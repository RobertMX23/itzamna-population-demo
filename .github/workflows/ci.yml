name: demo-ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate population dataset contract
        run: python scripts/validate_population_dataset.py data/synthetic/catalog.json
      - name: Profile population dataset
        run: python scripts/profile_population_dataset.py data/synthetic/catalog.json docs/analysis/population_profile.json
      - name: Normalize population dataset
        run: python scripts/normalize_population_dataset.py data/synthetic/catalog.json data/processed/population_observations.csv
      - name: Load SQLite analytical table
        run: python scripts/load_population_sqlite.py data/processed/population_observations.csv data/processed/population.sqlite3 queries/schema.sql
      - name: Run SQL analysis queries
        run: python scripts/run_population_queries.py data/processed/population.sqlite3 docs/analysis/population_sql_report.json
      - name: Run tests
        run: python -m pytest -q
      - name: Install E2E dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run dashboard E2E tests
        run: npm run test:e2e
