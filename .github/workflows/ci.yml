name: demo-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate population dataset contract
        run: python scripts/validate_population_dataset.py data/synthetic/catalog.json
      - name: Profile population dataset
        run: python scripts/profile_population_dataset.py data/synthetic/catalog.json docs/analysis/population_profile.json
      - name: Normalize population dataset
        run: python scripts/normalize_population_dataset.py data/synthetic/catalog.json data/processed/population_observations.csv
      - name: Load SQLite analytical table
        run: python scripts/load_population_sqlite.py data/processed/population_observations.csv data/processed/population.sqlite3 queries/schema.sql
      - name: Run SQL analysis queries
        run: python scripts/run_population_queries.py data/processed/population.sqlite3 docs/analysis/population_sql_report.json
      - name: Generate EDA report
        run: python scripts/generate_population_eda.py data/processed/population.sqlite3 docs/analysis/population_profile.json docs/analysis/population_eda.md
      - name: Run tests
        run: python -m pytest -q
      - name: Install E2E dependencies
        run: npm ci
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate dashboard JavaScript syntax
        run: node --check dashboard/app.js
      - name: Run dashboard E2E tests
        run: npm run test:e2e
      - name: Upload analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-01-analysis-evidence
          path: |
            docs/analysis/population_profile.json
            docs/analysis/population_sql_report.json
            docs/analysis/population_eda.md
            docs/analysis/population_insights.md
          if-no-files-found: error
